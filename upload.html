<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>批量上传照片</title>
<meta name="theme-color" content="#eae7e0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231f4e79'/%3E%3Ctext x='50' y='62' font-family='sans-serif' font-size='34' font-weight='700' fill='%23fdfcf9' text-anchor='middle'%3E传%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/photos.css">
</head>
<body class="photos-body">

<header class="pbar">
  <a id="back" class="pbar__back" href="index.html">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
    <span>返回行程</span>
  </a>
  <div class="pbar__id">
    <h1 class="pbar__name">批量上传照片</h1>
    <div id="who" class="pbar__day"></div>
  </div>
  <div class="pbar__actions">
    <button id="signin" class="pbtn" type="button" hidden>登录</button>
  </div>
</header>

<main class="pmain">
  <div id="gate" class="pstatus" hidden>上传需要登录 —— 点右上角「登录」，填邮箱收一条登录链接。</div>

  <form id="panel" class="up-panel" hidden>
    <label class="up-field">
      <span class="up-label">地点</span>
      <select id="spot" class="pinput"></select>
    </label>

    <fieldset class="up-field up-quality">
      <span class="up-label">画质</span>
      <label><input type="radio" name="q" value="hq" checked> 高质量压缩<small>（最长边 4096px · 约 1‒2MB，构图细节都在）</small></label>
      <label><input type="radio" name="q" value="raw"> 原图直传<small>（JPEG/PNG/WebP 不压缩；HEIC 会转成 JPEG，否则很多设备打不开）</small></label>
    </fieldset>

    <div id="drop" class="up-drop" tabindex="0">
      <strong>点这里选照片</strong>（可多选），或把照片拖进来
    </div>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </form>

  <ul id="queue" class="up-queue"></ul>
  <div id="summary" class="up-summary" hidden>
    <span id="summary-text"></span>
    <a id="view" class="pbtn pbtn--primary">看这个地点的照片墙</a>
  </div>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<dialog id="auth" class="pdialog">
  <form id="auth-form" method="dialog">
    <h2 class="pdialog__title">登录后才能上传</h2>
    <p class="pdialog__hint">输入邮箱和密码登录；密码留空则发一条登录链接到邮箱。</p>
    <input id="auth-email" class="pinput" type="email" inputmode="email" autocomplete="email"
           placeholder="you@example.com" required>
    <input id="auth-pw" class="pinput" type="password" autocomplete="current-password"
           placeholder="密码（留空则走邮件链接）">
    <div class="pdialog__row">
      <button id="auth-cancel" class="pbtn" type="button">取消</button>
      <button id="auth-send" class="pbtn pbtn--primary" type="submit">登录</button>
    </div>
    <div id="auth-msg" class="pdialog__msg"></div>
  </form>
</dialog>

<script src="assets/config.js" defer></script>
<script src="assets/data.js" defer></script>
<script src="assets/vendor/supabase.min.js" defer></script>
<script type="module" src="assets/upload.js"></script>
</body>
</html>
